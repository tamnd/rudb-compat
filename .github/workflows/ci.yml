# The per-commit gate. Everything here is required to merge.
#
# This repository is a harness rather than a library, so the matrix is smaller than the engine's:
# what matters is that it builds and runs where someone would run it, which is Linux for the
# nightly sweeps and macOS for a laptop. Both legs install a real DuckDB of a named version before
# the tests, because the differential tests skip when there is not one and a suite that silently
# skips its only interesting test is worse than no suite.
#
# Actions are pinned to a patch version rather than a major tag, so a run can be reproduced.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # The newest released DuckDB. rudb vendors its grammar from a commit on the v2.0 development
  # branch, which has no published binary, and building one here would put a forty minute C++ build
  # in front of a fourteen second test run. So this leg is the allowed fallback: it proves the
  # harness builds and runs, every report it produces says it is not the pinned commit, and the
  # pinned runs happen on the lab machines, which have the binary installed by `scripts/oracle` in
  # the rudb repository. Written down here rather than resolved to latest, because a compatibility
  # number whose other side moved on its own is not a measurement.
  DUCKDB_VERSION: v1.5.5

jobs:
  quick:
    name: format and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: test on ${{ matrix.os }}
    needs: quick
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install duckdb
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux) asset=duckdb_cli-linux-amd64.zip ;;
            macOS) asset=duckdb_cli-osx-universal.zip ;;
            *) echo "no duckdb build wired up for ${{ runner.os }}" >&2; exit 1 ;;
          esac
          url=https://github.com/duckdb/duckdb/releases/download/$DUCKDB_VERSION/$asset
          curl -fsSL --retry 3 -o duckdb.zip "$url"
          unzip -q duckdb.zip -d "$RUNNER_TEMP/duckdb"
          chmod +x "$RUNNER_TEMP/duckdb/duckdb"
          echo "RUDB_COMPAT_DUCKDB=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/duckdb/duckdb" -version
      - name: cargo test
        run: cargo test --all-features
      # The tests skip when there is no DuckDB, so passing tests alone do not prove the differential
      # path ran. This step fails outright when the binary is missing, and it prints which one CI
      # measured against, which is the thing every number in a report has to be read next to.
      - name: the harness found the duckdb it was given
        run: cargo run -q -- duckdb
      - name: the m0 corpus still parses the same on both engines
        run: cargo run -q -- parse corpus/m0.sql
      # The prose rules are checked by a test, so this is covered above. What is not covered above
      # is that the command line still answers, which is the whole of what this binary does today.
      - name: the harness reports its levels
        run: cargo run -q -- levels

  # The DuckDB sqllogictest corpus, run against rudb on every commit and published on the run
  # summary. This is the number issue 3 in the engine repository asks for, and it is here rather
  # than in a nightly job because a conformance number that runs once a night is a number nobody
  # can attribute to a commit. The whole corpus takes a couple of seconds, so there is no reason
  # to run it any less often than everything else.
  #
  # It does not fail on a low number. rudb is being built and the number is low by construction
  # until the milestones are done, so a threshold here would mean a red tick every day until the
  # day it goes green, and a check that is always red is a check nobody reads. What guards against
  # a fall is the committed corpus under corpus/slt, which cargo test runs and which has to pass
  # in full. This job publishes and does not gate.
  conformance:
    name: duckdb sqllogictest pass rate
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: fetch the corpus
        run: cargo run --release -q -- vendor | tee vendor.txt
      - name: run the corpus
        run: cargo run --release -q -- slt | tee slt.txt
      - name: publish the pass rate
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## DuckDB sqllogictest"
            echo
            echo '```'
            cat vendor.txt
            echo '```'
            echo
            echo '```'
            tail -2 slt.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -2 slt.txt
      - name: keep the failures for reading
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sqllogictest-failures
          path: slt.txt
          retention-days: 14

  docs:
    name: documentation
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo doc --all-features --no-deps

  ci:
    name: ci
    if: always()
    needs: [quick, test, conformance, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
