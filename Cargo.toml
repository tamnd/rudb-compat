# Not published. This is a harness, it depends on a real DuckDB and on rudb at once, and nobody
# should be depending on it from a build.
[package]
name = "rudb-compat"
version = "0.3.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rudb-compat"
description = "The DuckDB compatibility harness for rudb."
publish = false

[dependencies]
# rudb is not published in a usable state yet, so this tracks the branch and the lock file pins
# the commit. That is the right way round for a harness: it should follow the engine, and a run
# should still say exactly which engine it followed.
#
# One dependency, and that is on purpose. This harness is the closest thing the project has to
# somebody embedding rudb, so anything it needs and cannot get from here is something the embedding
# API is missing. It used to list rudb-common and rudb-parse as well, and each of those was a hole
# in rudb wearing a dependency as a workaround.
rudb = { git = "https://github.com/tamnd/rudb", branch = "main" }

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
doc_markdown = "allow"
missing_panics_doc = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The corpus is an engine running SQL, not a harness doing arithmetic, so almost all of the time a
# run takes is spent inside rudb. rudb arrives here as a dependency rather than as a workspace
# member, which is why this line reaches it at all and why it is worth so much: the corpus used to
# run the whole engine unoptimized. Measured on an i9-13900K, the corpus stage of rudb's gate is
# 16.0 seconds without these two lines and 5.5 seconds with them, over three interleaved runs each.
#
# `debug-assertions` is on either way, which is the part that matters for what this repository is
# for. The plan verifier and the pin accounting are gated on that and not on the optimization
# level, so the corpus still runs with every check rudb makes about itself turned on.
[profile.dev.package."*"]
opt-level = 2

# Our own code stays close to the source, the way rudb's own manifest puts it. There is not much of
# it and none of it is in a loop.
[profile.dev]
opt-level = 1
